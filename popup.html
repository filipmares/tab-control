<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header" id="app-header">
        <div class="header__copy">
          <h1 data-i18n="extensionName"></h1>
          <p data-i18n="tagline"></p>
        </div>
        <button
          class="header__issue"
          id="report-issue"
          type="button"
          data-i18n="reportIssue"
          data-i18n-attrs="aria-label:reportIssue;title:reportIssue"
        >
        </button>
      </header>

      <section
        class="actions"
        id="tab-actions"
        data-i18n-attrs="aria-label:tabActions"
      >
        <div class="action-group action-group--primary">
          <button
            class="action action--primary action--danger"
            id="close-duplicates"
            type="button"
            data-i18n-attrs="title:closeDuplicatesDescription;aria-description:closeDuplicatesDescription"
          >
            <span class="action__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="3.5" y="5.5" width="11" height="11" />
                <path d="M9.5 3.5h11v11M14.5 9.5l5 5m0-5-5 5" />
              </svg>
            </span>
            <span class="action__copy">
              <strong data-i18n="closeDuplicates"></strong>
              <small data-i18n="closeDuplicatesSummary"></small>
            </span>
            <kbd class="action__shortcut" aria-hidden="true" data-i18n="shortcutDuplicates"></kbd>
          </button>
        </div>

        <div
          class="action-group action-group--organize"
          role="group"
          aria-labelledby="organize-title"
        >
          <h2 class="action-group__title" id="organize-title" data-i18n="organize"></h2>
          <div class="action-group__list">
            <button
              class="action"
              id="sort-by-domain"
              type="button"
              data-i18n-attrs="title:sortDescription;aria-description:sortAriaDescription"
            >
              <span class="action__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M4 6h10M4 12h7M4 18h4M17 5v14m0 0-3-3m3 3 3-3" />
                </svg>
              </span>
              <span class="action__copy">
                <strong data-i18n="sortTabs"></strong>
                <small data-i18n="sortSummary"></small>
              </span>
              <kbd class="action__shortcut" aria-hidden="true" data-i18n="shortcutSort"></kbd>
            </button>

            <button
              class="action"
              id="toggle-domain-groups"
              type="button"
              data-i18n-attrs="title:groupActionDescription;aria-description:groupActionDescription"
            >
              <span class="action__icon" id="domain-group-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="3.5" y="5.5" width="7" height="13" />
                  <rect x="13.5" y="5.5" width="7" height="13" />
                  <path d="M7 2.5v3m10-3v3" />
                </svg>
              </span>
              <span class="action__copy">
                <strong id="domain-group-title" data-i18n="groupTabs"></strong>
                <small id="domain-group-description" data-i18n="groupSummary"></small>
              </span>
              <kbd class="action__shortcut" aria-hidden="true" data-i18n="shortcutGroup"></kbd>
            </button>

            <button
              class="action"
              id="gather-tabs-here"
              type="button"
              data-i18n-attrs="title:gatherDescription;aria-description:gatherDescription"
            >
              <span class="action__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M4 7h6M7 4l3 3-3 3M20 17h-6m3-3-3 3 3 3M12 3v18" />
                </svg>
              </span>
              <span class="action__copy">
                <strong data-i18n="gatherTabs"></strong>
                <small data-i18n="gatherSummary"></small>
              </span>
              <kbd class="action__shortcut" aria-hidden="true" data-i18n="shortcutGather"></kbd>
            </button>
          </div>
        </div>

        <div class="action-group action-group--recovery">
          <button
            class="action action--recovery"
            id="open-recently-closed"
            type="button"
            data-i18n-attrs="title:recentDescription;aria-description:recentDescription"
          >
            <span class="action__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 7H2V4M3 7a9 9 0 1 1-1 7M12 7v5l3 2" />
              </svg>
            </span>
            <span class="action__copy">
              <strong data-i18n="recentlyClosed"></strong>
              <small data-i18n="recentSummary"></small>
            </span>
            <kbd class="action__shortcut" aria-hidden="true" data-i18n="shortcutRecent"></kbd>
          </button>
        </div>
      </section>

      <section
        class="review"
        id="duplicate-review"
        aria-labelledby="review-title"
        hidden
      >
        <div class="review__header">
          <button
            class="review__back"
            id="stop-review"
            type="button"
            data-i18n-attrs="title:stopReview"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5m0 0 5-5m-5 5 5 5" />
            </svg>
            <span class="visually-hidden" data-i18n="stopReview"></span>
          </button>
          <div class="review__heading">
            <h2 id="review-title" data-i18n="reviewSimilarTabs"></h2>
            <p id="review-progress"></p>
          </div>
          <span class="review__header-spacer" aria-hidden="true"></span>
        </div>
        <div class="review__tabs" id="review-tabs"></div>
        <div class="review__controls">
          <button
            class="review__keep-all"
            id="keep-all-review-tabs"
            type="button"
          >
          </button>
          <button
            class="review__close-all"
            id="close-all-review-tabs"
            type="button"
          >
          </button>
        </div>
      </section>

      <section
        class="recent"
        id="recent-view"
        aria-labelledby="recent-title"
        hidden
      >
        <div class="recent__header">
          <button
            class="recent__nav"
            id="recent-back"
            type="button"
            data-i18n-attrs="title:backToActions"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5m0 0 5-5m-5 5 5 5" />
            </svg>
            <span class="visually-hidden" data-i18n="backToActions"></span>
          </button>
          <div class="recent__heading">
            <h2 id="recent-title" data-i18n="recentlyClosed"></h2>
            <p id="recent-scope" data-i18n="recentScope"></p>
          </div>
          <button
            class="recent__nav"
            id="recent-refresh"
            type="button"
            data-i18n-attrs="title:refreshRecent"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 7v5h-5M5 17v-5h5M7 8a7 7 0 0 1 11.5 2M17 16a7 7 0 0 1-11.5-2" />
            </svg>
            <span class="visually-hidden" data-i18n="refreshRecent"></span>
          </button>
        </div>

        <div
          class="recent-state"
          id="recent-state"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >
          <span class="recent-state__signal" aria-hidden="true"></span>
          <div>
            <h3 id="recent-state-title"></h3>
            <p id="recent-state-message"></p>
          </div>
        </div>

        <ol
          class="recent__list"
          id="recent-list"
          data-i18n-attrs="aria-label:recentListLabel"
          aria-describedby="recent-scope"
          hidden
        ></ol>
      </section>

      <div class="status" id="status">
        <div class="status__message" role="status" aria-live="polite">
          <span class="status__dot" aria-hidden="true"></span>
          <span id="status-text"></span>
        </div>
        <div class="status__undo" id="undo-offer" hidden>
          <span id="undo-text"></span>
          <span aria-hidden="true">·</span>
          <button class="status__undo-button" id="undo-cleanup" type="button">
            <span data-i18n="undo"></span>
          </button>
        </div>
      </div>

    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
